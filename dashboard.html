<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeeManager — Dashboard</title>
  <meta name="description" content="Fee Management System Dashboard — manage students, fees, payments, and reports.">
  <link rel="stylesheet" href="css/style.css?v=light-theme">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Razorpay Checkout; configure the public key in the block below. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.FMS_API_BASE = window.location.hostname === 'localhost'
      ? 'http://localhost:5000/api'
      : `${window.location.origin}/api`;
    window.RAZORPAY_KEY_ID = '';
  </script>

  <style>
    /* Additional dashboard-specific styles */
    .font-mono { font-family: 'Courier New', monospace; }

    /* Print styles */
    @media print {
      .sidebar, .topbar, .page-header-actions, .btn, .toolbar { display:none!important; }
      .main-content { margin-left:0!important; }
      body { background:#fff!important; color:#000!important; }
      .card { border:1px solid #ddd!important; background:#fff!important; }
      table { font-size:11px!important; }
      th,td { color:#000!important; border-bottom:1px solid #ddd!important; }
    }

    /* Page transition */
    #page-content {
      transition: opacity .15s var(--ease);
    }
    #page-content.fade-out { opacity:0; }

    /* Chart.js canvas override */
    canvas { display:block; }
  </style>
</head>
<body>
  <!-- App Shell (rendered by app.js) -->
  <div id="app-shell"></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Core data layer -->
  <script src="js/data.js"></script>

  <!-- Utility & router -->
  <script src="js/app.js"></script>

  <!-- Feature modules -->
  <script src="js/charts.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/student.js"></script>
  <script src="js/staff.js"></script>

  <script>
    // Bootstrap the app
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });

    // Global keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') Modal.closeAll();
    });

    // Close modal on overlay click
    document.addEventListener('click', e => {
      if (e.target.classList.contains('modal-overlay') && e.target.classList.contains('open')) {
        Modal.closeAll();
      }
    });
  </script>
</body>
